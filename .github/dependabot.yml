# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # SwiftPM dependencies declared in Package.swift.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"

  # The Node counterpart used for fixtures and the closed-loop checks.
  - package-ecosystem: "npm"
    directory: "/interop"
    schedule:
      interval: "weekly"

  # The workflows pin third-party actions by tag, which drifts silently. They also run with
  # repository context, so they are watched as closely as the library dependencies.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR per week for all action bumps rather than one per action.
      actions:
        patterns: ["*"]
