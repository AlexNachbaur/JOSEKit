name: Build

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch are pointless once a newer commit exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository; the default token permissions are wider than needed.
permissions:
  contents: read

# Job topology is three tiers, deliberately serial at the top:
#
#   lint  ->  linux  ->  { macos, ios, windows, android }
#
# `lint` takes seconds on the cheapest runner and a formatting failure blocks a merge as surely
# as a compile failure, so nothing else starts until it passes. `linux` is the cheapest runner
# that builds and runs the whole suite, so a commit that does not compile is rejected before a
# slow or expensive runner is spent on it.
#
# Linux and macOS also run the closed-loop interoperability checks against panva/jose, which
# need Node.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - name: swift-format
        run: swift format lint --strict --recursive Sources Tests Package.swift

  linux:
    name: Build & Test (Linux)
    needs: lint
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Interoperability
        run: ./scripts/interop.sh

  macos:
    name: Build & Test (macOS)
    needs: linux
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          # Package.resolved is deliberately not committed, so Package.swift is what declares
          # the dependency versions.
          key: macos-spm-${{ hashFiles('Package.swift') }}
          restore-keys: macos-spm-
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Interoperability
        run: ./scripts/interop.sh

  ios:
    name: Build & Test (iOS Simulator)
    needs: linux
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      # SwiftPM cannot run a test bundle on a simulator, so the iOS leg goes through xcodebuild
      # against the scheme Xcode synthesises for the package. It is the only job that proves the
      # iOS deployment target in Package.swift is real, and the only one where the Secure
      # Enclave and keychain code runs on iOS.
      - name: Build & test
        run: |
          xcodebuild test \
            -scheme JOSEKit-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'

  windows:
    name: Build & Test (Windows)
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # SwiftyLab/setup-swift installs a Swift toolchain on every host platform and wires up the
      # MSVC environment Swift needs on Windows. It publishes no moving major tag, so it is
      # pinned to an exact release and left to Dependabot to bump.
      - uses: SwiftyLab/setup-swift@v1.14.1
        with:
          swift-version: '6.3'
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  android:
    name: Build & Test (Android)
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Runs the suite in an emulator rather than only cross-compiling, so the Android leg checks
      # behaviour and not just that the code type-checks.
      - name: Build and test on Android emulator
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: '6.3'
          android-api-level: 28
          free-disk-space: true
