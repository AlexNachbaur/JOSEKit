name: Feature request
description: Suggest new functionality or an API improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [TODO.md](../blob/main/TODO.md) first: it lists what is deferred or deliberately left out, and why.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that JOSEKit doesn't support today? Name the RFC or specification if there is one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        How you imagine it working. A sketch of the Swift API you'd like to write is ideal.
      render: swift
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, or other API shapes that could solve the same problem.
    validations:
      required: false
